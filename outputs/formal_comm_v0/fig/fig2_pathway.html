<!DOCTYPE html><html lang='zh-CN'><head><meta charset='utf-8'><style>
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: #f4f6f8; color: #4a5763;
  font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "Yu Gothic UI",
    Meiryo, "Noto Sans CJK SC", sans-serif;
  font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased;
}
a { color: #1f4e5f; text-decoration: none; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 26px 90px; }

/* top bar */
.topbar {
  position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,0.92);
  backdrop-filter: blur(8px); border-bottom: 1px solid #e3e8ec;
}
.topbar .inner { max-width: 1080px; margin: 0 auto; padding: 11px 26px;
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.topbar .brand { font-weight: 700; color: #22303a; letter-spacing: .2px; }
.topbar nav { display: flex; gap: 16px; flex-wrap: wrap; margin-left: auto; }
.topbar nav a { color: #7c8791; font-size: 13.5px; }
.topbar nav a:hover { color: #1f4e5f; }

/* hero */
.hero { padding: 54px 0 30px; border-bottom: 1px solid #e3e8ec; }
.hero .tag { display:inline-block; background:#eaf1f2; color:#1f4e5f;
  font-size:12.5px; font-weight:600; padding:4px 12px; border-radius:999px;
  letter-spacing:.4px; }
.hero h1 { color:#22303a; font-size:30px; line-height:1.3; margin:16px 0 10px;
  letter-spacing:.3px; }
.hero .sub { font-size:16px; color:#4a5763; max-width:760px; }
.hero .meta { margin-top:16px; color:#7c8791; font-size:13.5px; }

/* sections */
section { padding: 40px 0 8px; scroll-margin-top: 64px; }
.kicker { color:#1f4e5f; font-size:12.5px; font-weight:700; letter-spacing:1.4px;
  text-transform: uppercase; margin-bottom:8px; }
h2 { color:#22303a; font-size:22px; margin:2px 0 6px; letter-spacing:.3px; }
h3 { color:#22303a; font-size:16.5px; margin:26px 0 4px; }
.section-lead { color:#4a5763; max-width:820px; margin:6px 0 20px; }
p { margin: 10px 0; }

/* metric cards */
.metrics { display:grid; grid-template-columns: repeat(4,1fr); gap:14px; margin:14px 0 6px; }
.metric { background:#ffffff; border:1px solid #e3e8ec; border-radius:14px;
  padding:16px 18px; box-shadow:0 1px 2px rgba(30,50,60,.04); }
.metric .num { font-size:27px; font-weight:700; color:#1f4e5f; letter-spacing:.4px; }
.metric .lab { font-size:13px; color:#7c8791; margin-top:2px; }
.metric .sub { font-size:12px; color:#7c8791; margin-top:6px; border-top:1px dashed #e3e8ec;
  padding-top:6px; }

/* value cards */
.vgrid { display:grid; grid-template-columns: repeat(3,1fr); gap:16px; margin-top:10px; }
.vcard { background:#ffffff; border:1px solid #e3e8ec; border-radius:14px; padding:20px;
  box-shadow:0 1px 2px rgba(30,50,60,.04); }
.vcard .n { display:inline-flex; width:28px; height:28px; border-radius:8px;
  background:#eaf1f2; color:#1f4e5f; font-weight:700; align-items:center;
  justify-content:center; font-size:14px; }
.vcard h4 { color:#22303a; font-size:15.5px; margin:12px 0 6px; }
.vcard p { font-size:14px; margin:0; color:#4a5763; }

/* plan alignment strip */
.plan { display:grid; grid-template-columns: repeat(4,1fr); gap:12px; margin-top:18px; }
.pstep { border:1px solid #e3e8ec; border-radius:12px; padding:14px 16px; background:#ffffff; }
.pstep .ph { font-weight:700; color:#22303a; }
.pstep .st { font-size:12.5px; font-weight:700; padding:2px 9px; border-radius:999px;
  display:inline-block; margin-top:8px; }
.st-done { background:#e7f1ea; color:#3a6b4d; }
.st-prog { background:#fdf1dc; color:#9a6a1c; }
.pstep p { font-size:13px; color:#7c8791; margin:8px 0 0; }

/* figure card */
.figure { background:#ffffff; border:1px solid #e3e8ec; border-radius:16px;
  padding:24px 26px 20px; margin:18px 0; box-shadow:0 2px 10px rgba(30,50,60,.05); }
.figure .fig-h { color:#22303a; font-weight:700; font-size:16px; }
.figure .fig-sub { color:#7c8791; font-size:13px; margin:2px 0 16px; }
.readnote { font-size:12.8px; color:#7c8791; margin:14px 0 0; padding:10px 14px;
  background:#f8fafb; border-left:3px solid #c9d5da; border-radius:0 8px 8px 0; }
.readnote b { color:#4a5763; }

/* heatmap */
.hm-wrap { display:flex; gap:26px; flex-wrap:wrap; align-items:flex-start; }
.hm-grid { display:grid; grid-template-columns: 180px repeat(7, 1fr);
  gap:4px; flex:1 1 560px; min-width:520px; }
.hm-cell { height:38px; display:flex; align-items:center; justify-content:center;
  font-size:13px; border-radius:6px; }
.hm-corner { background:transparent; }
.hm-head { background:#eaf1f2; color:#1f4e5f; font-weight:700; }
.hm-row { justify-content:flex-end; padding-right:10px; color:#22303a; font-weight:600;
  font-size:12.5px; text-align:right; }
.hm-val { font-weight:700; font-variant-numeric:tabular-nums; }
.frame-key { list-style:none; margin:0; padding:0; flex:0 0 210px; font-size:13px; }
.frame-key li { padding:5px 0; color:#4a5763; border-bottom:1px dashed #e3e8ec; }
.fk-code { display:inline-block; width:30px; font-weight:700; color:#1f4e5f; }
.fk-en { color:#7c8791; font-size:11.5px; }

/* pathway svg */
.pathway { width:100%; height:auto; display:block; }
.pw-title { font-size:13px; font-weight:700; fill:#22303a; }
.pw-node { font-size:11px; fill:#22303a; }
.pw-tag { font-size:10px; font-weight:700; }

/* bridge list */
.bridge-list { list-style:none; margin:6px 0 0; padding:0; }
.bridge-row { display:flex; align-items:center; gap:12px; padding:9px 4px;
  border-bottom:1px solid #e3e8ec; }
.bridge-dot { width:11px; height:11px; border-radius:50%; flex:0 0 auto; }
.bridge-id { font-family:ui-monospace,Consolas,monospace; font-size:12.5px;
  color:#7c8791; flex:0 0 46px; }
.bridge-name { color:#22303a; font-weight:600; font-size:13.5px; flex:1 1 200px;
  min-width:150px; }
.bridge-issues { display:flex; gap:5px; flex-wrap:wrap; flex:2 1 300px; }
.issue-chip { font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid;
  white-space:nowrap; }
.ev-badge { color:#fff; font-size:11px; font-weight:700; padding:2px 8px;
  border-radius:6px; flex:0 0 auto; }
.bridge-legend { display:flex; gap:16px; flex-wrap:wrap; margin-top:14px;
  font-size:12.5px; color:#4a5763; align-items:center; }
.olg { display:inline-flex; align-items:center; gap:6px; }
.olg i { width:11px; height:11px; border-radius:3px; display:inline-block; }
.olg-note { color:#7c8791; margin-left:auto; }

/* coaction bars */
.cbar-wrap { display:flex; flex-direction:column; gap:18px; margin-top:4px; }
.cbar-label { font-weight:700; color:#22303a; font-size:14px; margin-bottom:6px; }
.cbar-track { display:flex; height:26px; border-radius:7px; overflow:hidden;
  background:#eef2f4; }
.cbar-seg { height:100%; }
.cbar-meta { font-size:12.5px; color:#7c8791; margin-top:5px; }
.cbar-meta b { color:#4a5763; }

/* tables */
.grid-table { width:100%; border-collapse:collapse; margin:8px 0; font-size:13.5px;
  background:#ffffff; border:1px solid #e3e8ec; border-radius:12px; overflow:hidden; }
.grid-table th { background:#f4f7f8; color:#22303a; text-align:left; font-weight:700;
  padding:11px 13px; font-size:12.5px; border-bottom:1px solid #e3e8ec; }
.grid-table td { padding:11px 13px; border-bottom:1px solid #e3e8ec; vertical-align:top;
  color:#4a5763; }
.grid-table tr:last-child td { border-bottom:none; }
.grid-table .lead { color:#22303a; }
.mono { font-family:ui-monospace,Consolas,monospace; font-size:12.5px; }
.mono.go { color:#3a6b4d; font-weight:700; }
.mono.hold { color:#9a6a1c; font-weight:700; }
.small { font-size:11.5px; }
.dim { color:#7c8791; }
.nowrap { white-space:nowrap; }
.pill { font-size:11.5px; font-weight:700; padding:2px 9px; border-radius:999px; }
.pri-p1 { background:#e9f0f4; color:#1f4e5f; }
.pri-p2 { background:#f1f0f4; color:#6a5f8f; }
.lr-block { margin:18px 0; }
.lr-h { font-size:14px; margin:0 0 8px; padding:8px 14px; border-radius:9px; }
.lr-h-go { background:#e7f1ea; color:#356048; }
.lr-h-hold { background:#fbf0dc; color:#8a611c; }

/* caveats */
.caveats { display:grid; grid-template-columns: repeat(2,1fr); gap:14px; margin-top:8px; }
.cav { background:#ffffff; border:1px solid #e3e8ec; border-left:4px solid #c98e56;
  border-radius:10px; padding:14px 16px; }
.cav b { color:#22303a; }
.cav p { margin:4px 0 0; font-size:13.5px; }

footer { margin-top:40px; padding-top:22px; border-top:1px solid #e3e8ec;
  color:#7c8791; font-size:12.5px; }

@media (max-width: 860px) {
  .metrics, .vgrid, .plan, .caveats { grid-template-columns: 1fr 1fr; }
  .hm-grid { grid-template-columns: 120px repeat(7,1fr); min-width:0; }
}
@media print {
  .topbar { position:static; }
  body { background:#fff; }
  .figure, .metric, .vcard { box-shadow:none; }
}
