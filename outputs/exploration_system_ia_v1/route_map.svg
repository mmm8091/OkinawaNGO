  <rect x="100" y="786" width="130" height="24" rx="12" fill="#eef4f8" stroke="#3d6b8f"/><text x="165" y="802" font-size="11.5" fill="#2b4d68" text-anchor="middle">来源支持·有界表述</text>
  <text x="240" y="802" font-size="11.5" fill="#5a6b72">source_backed_bounded　→ 演示层 ✓（带边界句）</text>
  <rect x="100" y="818" width="96" height="24" rx="12" fill="#fdf6e3" stroke="#c9a227"/><text x="148" y="834" font-size="11.5" fill="#7a611a" text-anchor="middle">候选·未复核</text>
  <text x="206" y="834" font-size="11.5" fill="#5a6b72">candidate　→ 仅研究层，带黄色徽章</text>
  <rect x="100" y="850" width="96" height="24" rx="12" fill="#f0f0f0" stroke="#8a8a8a"/><text x="148" y="866" font-size="11.5" fill="#555" text-anchor="middle">分析种子</text>
  <text x="206" y="866" font-size="11.5" fill="#5a6b72">analytical_seed　→ 仅研究层，灰色徽章</text>
  <rect x="100" y="882" width="96" height="24" rx="12" fill="#faeef2" stroke="#b5486b"/><text x="148" y="898" font-size="11.5" fill="#8a3350" text-anchor="middle">需当地材料</text>
  <text x="206" y="898" font-size="11.5" fill="#5a6b72">local_retrieval_gap　→ 演示层作缺口卡显示，不作为事实</text>
  <text x="100" y="936" font-size="12" fill="#5a6b72">研究层开关（全局单一·默认关）：开启后候选/种子/待审项可见且必带徽章，页顶常驻提示。</text>
  <text x="100" y="956" font-size="12" fill="#5a6b72">研究层不改写演示层文案，只增加带标记的内容。</text>

  <rect x="690" y="712" width="590" height="256" rx="8" fill="#ffffff" stroke="#c9d6d6"/>
  <text x="710" y="740" font-size="14" font-weight="bold" fill="#1f3a3d">历史证据类别（历史性主张必带）</text>
  <text x="710" y="766" font-size="12" fill="#5a6b72">同期一手 ／ 后来组织回顾 ／ 二手重建 ／ 线索 ／ 当地材料缺口</text>
  <text x="710" y="800" font-size="14" font-weight="bold" fill="#1f3a3d">全局硬规则</text>
  <text x="710" y="826" font-size="12" fill="#5a6b72">· 共同出现≠稳定联盟；度数≠影响力；请求≠回应；进入≠成功</text>
  <text x="710" y="848" font-size="12" fill="#5a6b72">· 来源发布年 ≠ 事件年；材料可见性 ≠ 组织活动强度</text>
  <text x="710" y="870" font-size="12" fill="#5a6b72">· event-only 名称与 X 制度节点不冒充 registry actor</text>
  <text x="710" y="892" font-size="12" fill="#5a6b72">· 无 E3/E4 官方记录不显示资助关系；不出现"资金网络"表述</text>
  <text x="710" y="914" font-size="12" fill="#5a6b72">· 界面文案不出现 HR-xxx / MT-xxx / 裸露 source_id</text>
  <text x="710" y="936" font-size="12" fill="#5a6b72">· 地图不是唯一入口；网络图不是默认首页；首屏无统计卡片</text>
