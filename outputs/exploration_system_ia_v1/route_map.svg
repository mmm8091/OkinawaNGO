  <!-- 图例 -->
  <rect x="80" y="712" width="590" height="256" rx="8" fill="#ffffff" stroke="#c9d6d6"/>
  <text x="100" y="740" font-size="14" font-weight="bold" fill="#1f3a3d">确定性分层（决定能否进演示层）</text>
  <rect x="100" y="754" width="96" height="24" rx="12" fill="#e3f2ec" stroke="#2f8f5b"/><text x="148" y="770" font-size="11.5" fill="#20603f" text-anchor="middle">已人工复核</text>
