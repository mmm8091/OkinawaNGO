<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">负责人确认的服务侧人物与资金分层网络</title>
  <desc id="desc">人物层显示 AWWA 与 KOSC 共享 Brooke Epp 和 Trinicia Kloepper，AWWA 与 OESC 共享 Amber Tracy，Lesilee DuFresne 只形成 OESC 内部连续性。资金层显示 OESC 向 AWWA 三个税期合计 39158 美元，以及 OESC 向 USO Okinawa 捐赠 3250 美元。Jen Yapsing 与 Jennifer Yapshing 保持未解决，不生成实线人物桥。</desc>
  <defs>
    <marker id="arrowMoney" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c97924"/>
    </marker>
    <style>
      .title{font:700 30px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#123f46}
      .sub{font:400 15px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#60777a}
      .section{font:700 18px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#123f46}
      .actor{fill:#f8fbf9;stroke:#16727a;stroke-width:2}
      .actorText{font:700 17px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#123f46;text-anchor:middle}
      .actorSub{font:400 12px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#60777a;text-anchor:middle}
      .person{fill:#dcefed;stroke:#16727a;stroke-width:1.6}
      .personText{font:600 13px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#123f46;text-anchor:middle}
      .personEdge{stroke:#16727a;stroke-width:2;fill:none}
      .moneyEdge{stroke:#c97924;stroke-width:4;fill:none;marker-end:url(#arrowMoney)}
      .moneyLabel{font:700 14px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#9c581a;text-anchor:middle}
      .note{font:400 13px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#60777a}
      .unresolved{fill:#faf9f4;stroke:#999b91;stroke-width:1.5;stroke-dasharray:6 5}
      .unresolvedEdge{stroke:#999b91;stroke-width:1.5;stroke-dasharray:6 5;fill:none}
      .badge{fill:#eef5f3;stroke:#c8d8d5;stroke-width:1}
      .badgeText{font:600 12px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#35686d;text-anchor:middle}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#f5f4ef"/>
  <text x="48" y="54" class="title">服务侧人物—资金网络：负责人确认后的研究层 overlay</text>
  <text x="48" y="82" class="sub">人物角色与资金流保持两套边；共人不等于控制，共款不等于联盟。全部端点位于 service-side。</text>
  <rect x="48" y="108" width="1184" height="398" rx="18" fill="#ffffff" stroke="#d5dfdc"/>
  <text x="72" y="142" class="section">人物角色层</text>
  <rect x="72" y="158" width="128" height="28" rx="14" class="badge"/>
  <text x="136" y="177" class="badgeText">3 名跨组织人物</text>
  <path d="M390 244 C470 214 520 214 600 244" class="personEdge"/>
  <path d="M390 310 C470 340 520 340 600 310" class="personEdge"/>
  <path d="M720 270 C805 220 850 220 930 270" class="personEdge"/>
  <path d="M980 338 L980 406" class="personEdge"/>
  <rect x="245" y="240" width="145" height="84" rx="14" class="actor"/>
  <text x="317" y="274" class="actorText">KOSC</text>
  <text x="317" y="298" class="actorSub">Kadena spouses club</text>
  <rect x="600" y="240" width="120" height="84" rx="14" class="actor"/>
  <text x="660" y="274" class="actorText">AWWA</text>
  <text x="660" y="298" class="actorSub">welfare intermediary</text>
  <rect x="930" y="240" width="100" height="84" rx="14" class="actor"/>
  <text x="980" y="274" class="actorText">OESC</text>
  <text x="980" y="298" class="actorSub">spouses club</text>
  <circle cx="493" cy="220" r="39" class="person"/>
  <text x="493" y="216" class="personText">Brooke</text>
  <text x="493" y="233" class="personText">Epp／Epps</text>
  <circle cx="493" cy="355" r="44" class="person"/>
  <text x="493" y="351" class="personText">Trinicia</text>
  <text x="493" y="368" class="personText">Kloepper</text>
  <circle cx="825" cy="220" r="40" class="person"/>
  <text x="825" y="216" class="personText">Amber</text>
  <text x="825" y="233" class="personText">Tracy</text>
  <circle cx="980" cy="430" r="43" class="person"/>
  <text x="980" y="426" class="personText">Lesilee</text>
  <text x="980" y="443" class="personText">DuFresne</text>
  <text x="1040" y="433" class="note">OESC 内部两期连续</text>
  <rect x="70" y="388" width="235" height="76" rx="12" class="unresolved"/>
  <text x="187" y="417" class="actorText" style="font-size:15px;fill:#62655f">AWWA ↔ NOSCO</text>
  <text x="187" y="440" class="actorSub">Jen Yapsing／Jennifer Yapshing</text>
  <text x="187" y="458" class="actorSub">未解决，不生成实线投影</text>
  <path d="M305 425 L385 425" class="unresolvedEdge"/>
  <text x="410" y="429" class="note">01b remain_unresolved</text>
  <rect x="48" y="530" width="1184" height="130" rx="18" fill="#fffaf3" stroke="#ead7bf"/>
  <text x="72" y="562" class="section" style="fill:#9c581a">资金流层</text>
  <path d="M930 600 C850 600 790 600 720 600" class="moneyEdge"/>
  <text x="825" y="586" class="moneyLabel">OESC → AWWA · 3 个税期 · USD 39,158</text>
  <rect x="600" y="574" width="120" height="54" rx="12" class="actor"/>
  <text x="660" y="607" class="actorText">AWWA</text>
  <rect x="930" y="574" width="100" height="54" rx="12" class="actor"/>
  <text x="980" y="607" class="actorText">OESC</text>
  <path d="M1030 600 C1080 600 1100 600 1140 600" class="moneyEdge"/>
  <text x="1082" y="582" class="moneyLabel" style="font-size:12px">USD 3,250</text>
  <rect x="1140" y="574" width="70" height="54" rx="12" class="actor"/>
  <text x="1175" y="597" class="actorText" style="font-size:14px">USO</text>
  <text x="1175" y="614" class="actorSub">Okinawa</text>
  <text x="48" y="694" class="sub">research_only · no central writeback · not frontend ready · 本图未评估问责侧 roster 或跨生态人物桥</text>
</svg>
