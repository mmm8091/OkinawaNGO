lass="value">-0.11</text><text x="747.4" y="340" font-size="21" style="fill:#24745f" text-anchor="middle">■</text><text x="762.4" y="338" class="value">-0.14</text><text x="584.4" y="357" font-size="21" style="fill:#446da8" text-anchor="middle">◆</text><text x="599.4" y="355" class="value">-0.31</text><text x="45" y="450" class="panel-title">B. 排除 legacy-token 未解析 actors（n=112）</text><text x="45" y="510" class="label">active：228（全层 238）</text><text x="1191.6" y="494" font-size="21" style="fill:#9b5a42" text-anchor="middle">●</text><text x="1206.6" y="492" class="value">0.31</text><text x="1137.3" y="511" font-size="21" style="fill:#24745f" text-anchor="middle">■</text><text x="1152.3" y="509" class="value">0.26</text><text x="754.1" y="528" font-size="21" style="fill:#446da8" text-anchor="middle">◆</text><text x="769.1" y="526" class="value">-0.14</text><text x="45" y="582" class="label">reviewed-only：65（全层 65）</text><text x="1446.7" y="566" font-size="21" style="fill:#9b5a42" text-anchor="middle">●</text><text x="1461.7" y="564" class="value">0.58</text><text x="1397.2" y="583" font-size="21" style="fill:#24745f" text-anchor="middle">■</text><text x="1412.2" y="581" class="value">0.53</text><text x="1161.5" y="600" font-size="21" style="fill:#446da8" text-anchor="middle">◆</text><text x="1176.5" y="598" class="value">0.28</text><text x="45" y="654" class="label">candidate-only：163（全层 173）</text><text x="752.2" y="638" font-size="21" style="fill:#9b5a42" text-anchor="middle">●</text><text x="767.2" y="636" class="value">-0.14</text><text x="724.1" y="655" font-size="21" style="fill:#24745f" text-anchor="middle">■</text><text x="739.1" y="653" class="value">-0.17</text><text x="567.9" y="672" font-size="21" style="fill:#446da8" text-anchor="middle">◆</text><text x="582.9" y="670" class="value">-0.33</text>
<text x="720" y="806" font-size="20" style="fill:#9b5a42">●</text><text x="745" y="804" class="legend">construction</text><text x="955" y="806" font-size="20" style="fill:#24745f">■</text><text x="980" y="804" class="legend">registry-only</text><text x="1190" y="806" font-size="20" style="fill:#446da8">◆</text><text x="1215" y="804" class="legend">outcome-excluded</text>
