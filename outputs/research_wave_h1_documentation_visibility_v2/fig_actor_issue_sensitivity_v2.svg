<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
<title id="title">Actor-issue sensitivity with source and actor deletions separated</title>
<desc id="desc">Two separate panels show retained actor-issue edges after source-support deletion and actor-node deletion. The units are not directly comparable.</desc>
<rect width="1600" height="780" fill="#f4f1e9"/>
<style>
text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#17312b}
.title{font-size:30px;font-weight:700}.subtitle{font-size:15px;fill:#5d6c66}
.panel-title{font-size:20px;font-weight:700}.axis{stroke:#48645c;stroke-width:1.2}
.grid{stroke:#d5d0c5;stroke-width:1}.tick{font-size:12px;fill:#66736f}
.label{font-size:14px}.detail{font-size:12px;fill:#6b5b3f}
.bar-source{fill:#2f7d68}.bar-actor{fill:#b0722f}.value{font-size:13px;font-weight:700}
.warning{font-size:14px;fill:#6a4822;font-weight:700}
</style>
<text x="55" y="48" class="title">同一 actor×issue 图，不同删除单位必须拆开读</text>
<text x="55" y="78" class="subtitle">左：删来源只移除“支持被耗尽”的 E3/E4 边。右：删 actor 会移除节点及全部 incident edges。两栏不能当作匹配反事实。</text>
<text x="65" y="145" class="panel-title">A. 删除 source support（E3/E4）</text><line x1="345" y1="177" x2="730" y2="177" class="axis"/><line x1="345.0" y1="177" x2="345.0" y2="655" class="grid"/><text x="345.0" y="168" class="tick" text-anchor="middle">50%</text><line x1="537.5" y1="177" x2="537.5" y2="655" class="grid"/><text x="537.5" y="168" class="tick" text-anchor="middle">75%</text><line x1="730.0" y1="177" x2="730.0" y2="655" class="grid"/><text x="730.0" y="168" class="tick" text-anchor="middle">100%</text><text x="65" y="232" class="label">移除 S004 的证据支持</text><rect x="345" y="215" width="250.2" height="28" class="bar-source"/><text x="605.2" y="234" class="value">82.5%</text><text x="65" y="254" class="detail">移除 41 条编码边</text><text x="65" y="306" class="label">移除 S003／S004／S006 的证据支持</text><rect x="345" y="289" width="224.1" height="28" class="bar-source"/><text x="579.1" y="308" class="value">79.1%</text><text x="65" y="328" class="detail">移除 49 条编码边</text><text x="65" y="380" class="label">移除组织托管来源的支持</text><rect x="345" y="363" width="69.3" height="28" class="bar-source"/><text x="424.3" y="382" class="value">59.0%</text><text x="65" y="402" class="detail">移除 96 条编码边</text><text x="65" y="454" class="label">移除法律／程序来源的支持</text><rect x="345" y="437" width="341.9" height="28" class="bar-source"/><text x="696.9" y="456" class="value">94.4%</text><text x="65" y="476" class="detail">移除 13 条编码边</text><text x="65" y="528" class="label">移除官方／行政来源的支持</text><rect x="345" y="511" width="338.8" height="28" class="bar-source"/><text x="693.8" y="530" class="value">94.0%</text><text x="65" y="550" class="detail">移除 14 条编码边</text><text x="65" y="602" class="label">移除媒体来源的支持</text><rect x="345" y="585" width="263.3" height="28" class="bar-source"/><text x="618.3" y="604" class="value">84.2%</text><text x="65" y="624" class="detail">移除 37 条编码边</text><text x="835" y="145" class="panel-title">B. 删除 actor nodes（active）</text><line x1="1115" y1="177" x2="1500" y2="177" class="axis"/><line x1="1115.0" y1="177" x2="1115.0" y2="655" class="grid"/><text x="1115.0" y="168" class="tick" text-anchor="middle">50%</text><line x1="1307.5" y1="177" x2="1307.5" y2="655" class="grid"/><text x="1307.5" y="168" class="tick" text-anchor="middle">75%</text><line x1="1500.0" y1="177" x2="1500.0" y2="655" class="grid"/><text x="1500.0" y="168" class="tick" text-anchor="middle">100%</text><text x="835" y="232" class="label">移除关联来源最多的 10 个 actor</text><rect x="1115" y="215" width="278.0" height="28" class="bar-actor"/><text x="1403.0" y="234" class="value">86.1%</text><text x="835" y="254" class="detail">移除 33 条编码边</text><text x="835" y="306" class="label">移除议题度数最高的 10 个 actor</text><rect x="1115" y="289" width="245.6" height="28" class="bar-actor"/><text x="1370.6" y="308" class="value">81.9%</text><text x="835" y="328" class="detail">移除 43 条编码边</text><text x="835" y="380" class="label">移除关联来源最少的 10 个 actor</text><rect x="1115" y="363" width="339.6" height="28" class="bar-actor"/><text x="1464.6" y="382" class="value">94.1%</text><text x="835" y="402" class="detail">移除 14 条编码边</text>
<rect x="55" y="690" width="1490" height="42" rx="8" fill="#eadfc9"/>
<text x="75" y="717" class="warning">边保留率只描述当前编码层；不表示现实组织、活动或社会关系按同比例消失。</text>
</svg>