<text x="45" y="52" class="title">一期公开资料样本：当前有效层六维 coverage bias v1</text>
<text x="45" y="82" class="subtitle">样本截点 2026-07-20；说明“当前资料让什么更可见”，不估计冲绳民间组织总体分布。</text>
<rect x="45" y="100" width="1510" height="58" rx="8" fill="#f2e5c9"/>
<text x="62" y="120" class="sample">当前可视统计：121 active actors／238 active actor-issue／130 active actor-place／295 sources；无总体分母。</text>
<text x="62" y="139" class="sample">中央历史边界：122 actor rows／248 actor-issue rows／135 actor-place rows；tombstone／excluded 只留审计历史。</text>
<text x="62" y="156" class="sample">每个面板计数单位不同，不能跨面板相加；source 数不等于活跃度，archive failed 不等于证据不存在。</text>
