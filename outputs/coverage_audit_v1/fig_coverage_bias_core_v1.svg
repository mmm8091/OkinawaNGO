<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1420" viewBox="0 0 1600 1420" role="img" aria-labelledby="title desc">
<title id="title">一期公开资料样本的六维覆盖偏差审计</title>
<desc id="desc">Six-panel audit of time, place, actor class and origin, issue, source type and archive status, and review and evidence status for 118 registry actors and 198 sources.</desc>
<rect width="1600" height="1420" fill="#f3f0e8"/>
<style>
text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#19312b} .title{font-size:32px;font-weight:700} .subtitle{font-size:16px;fill:#52635d} .sample{font-size:14px;fill:#6a4b16} .panel{fill:#fffdf8;stroke:#d7d3c8;stroke-width:1} .ph{font-size:22px;font-weight:700} .sub{font-size:13px;fill:#66736e} .lab{font-size:12px} .mini{font-size:11px;fill:#66736e} .val{font-size:12px;font-weight:700} .bar{fill:#26735f} .cell{font-size:11px;font-weight:700;fill:#15342c} .inside{font-size:11px;font-weight:700;fill:#ffffff} .note-bg{fill:#f2e5c9} .note{font-size:12px;fill:#5b431c}
</style>
<text x="45" y="52" class="title">一期公开资料样本：六维 coverage bias 核心图 v1</text>
<text x="45" y="82" class="subtitle">偏差审计说明“当前资料让什么更可见”，不估计冲绳民间组织总体分布。</text>
<rect x="45" y="105" width="1510" height="44" rx="8" fill="#f2e5c9"/>
<text x="62" y="123" class="sample">118 actors + 198 sources 均为公开资料驱动的工作样本；无总体分母。source 条数不等于组织活跃度；archive failed 不等于证据不存在。</text>
<text x="62" y="141" class="sample">每个面板的计数单位不同，不能跨面板相加或排序为“研究完成度”。</text>
<g transform="translate(30,170)"><rect width="750" height="390" rx="14" class="panel"/><text x="24" y="36" class="ph">D1 时间</text><text x="24" y="60" class="sub">source-log 年份分箱（n=198）</text><text x="24" y="99" class="lab">1972-1997</text><rect x="209" y="85" width="13.8" height="18" rx="4" class="bar"/><text x="232.8" y="99" class="val">4</text><text x="24" y="141" class="lab">1998-2012</text><rect x="209" y="127" width="44.7" height="18" rx="4" class="bar"/><text x="263.7" y="141" class="val">13</text><text x="24" y="183" class="lab">2013-2019</text><rect x="209" y="169" width="182.3" height="18" rx="4" class="bar"/><text x="401.3" y="183" class="val">53</text><text x="24" y="225" class="lab">2020-current</text><rect x="209" y="211" width="430.0" height="18" rx="4" class="bar"/><text x="649.0" y="225" class="val">125</text><text x="24" y="267" class="lab">unknown</text><rect x="209" y="253" width="10.3" height="18" rx="4" class="bar"/><text x="229.3" y="267" class="val">3</text><rect x="20" y="329" width="710" height="43" rx="8" class="note-bg"/><text x="32" y="347" class="note">2020+ 资料占 63.1%；这反映网页存续与检索路径，不是组织增长。</text><text x="32" y="365" class="note"></text></g><g transform="translate(820,170)"><rect width="750" height="390" rx="14" class="panel"/><text x="24" y="36" class="ph">D2 地点</text><text x="24" y="60" class="sub">actor-place 观察（n=124）</text><text x="24" y="95" class="lab">Henoko</text><rect x="209" y="81" width="430.0" height="18" rx="4" class="bar"/><text x="649.0" y="95" class="val">44</text><text x="24" y="125" class="lab">Okinawa Prefecture</text><rect x="209" y="111" width="381.1" height="18" rx="4" class="bar"/><text x="600.1" y="125" class="val">39</text><text x="24" y="155" class="lab">Oura Bay</text><rect x="209" y="141" width="58.6" height="18" rx="4" class="bar"/><text x="277.6" y="155" class="val">6</text><text x="24" y="185" class="lab">Yonaguni</text><rect x="209" y="171" width="58.6" height="18" rx="4" class="bar"/><text x="277.6" y="185" class="val">6</text><text x="24" y="215" class="lab">Camp Foster</text><rect x="209" y="201" width="39.1" height="18" rx="4" class="bar"/><text x="258.1" y="215" class="val">4</text><text x="24" y="245" class="lab">Ishigaki</text><rect x="209" y="231" width="29.3" height="18" rx="4" class="bar"/><text x="248.3" y="245" class="val">3</text><text x="24" y="275" class="lab">Kadena</text><rect x="209" y="261" width="29.3" height="18" rx="4" class="bar"/><text x="248.3" y="275" class="val">3</text><text x="24" y="305" class="lab">other places</text><rect x="209" y="291" width="185.7" height="18" rx="4" class="bar"/><text x="404.7" y="305" class="val">19</text><rect x="20" y="329" width="710" height="43" rx="8" class="note-bg"/><text x="32" y="347" class="note">Henoko 与全县宽泛编码占 83/124；关键地点之间不能作对称密度比较。</text><text x="32" y="365" class="note"></text></g><g transform="translate(30,580)"><rect width="750" height="390" rx="14" class="panel"/><text x="24" y="36" class="ph">D3 actor 功能／来源层</text><text x="24" y="60" class="sub">registry 原始 class 与 origin（n=118）</text><text x="24" y="93" class="lab">citizen_network</text><rect x="209" y="79" width="224.6" height="18" rx="4" class="bar"/><text x="443.6" y="93" class="val">24</text><text x="24" y="121" class="lab">citizen_group</text><rect x="209" y="107" width="149.7" height="18" rx="4" class="bar"/><text x="368.7" y="121" class="val">16</text><text x="24" y="149" class="lab">international_ngo</text><rect x="209" y="135" width="149.7" height="18" rx="4" class="bar"/><text x="368.7" y="149" class="val">16</text><text x="24" y="177" class="lab">domestic_japan_ngo</text><rect x="209" y="163" width="102.9" height="18" rx="4" class="bar"/><text x="321.9" y="177" class="val">11</text><text x="24" y="205" class="lab">international_advocacy_actor</text><rect x="209" y="191" width="65.5" height="18" rx="4" class="bar"/><text x="284.5" y="205" class="val">7</text><text x="24" y="233" class="lab">base_spouse_club</text><rect x="209" y="219" width="46.8" height="18" rx="4" class="bar"/><text x="265.8" y="233" class="val">5</text><text x="24" y="261" class="lab">other classes</text><rect x="209" y="247" width="365.0" height="18" rx="4" class="bar"/><text x="584.0" y="261" class="val">39</text><text x="24" y="285" class="mini">origin: okinawa_local 56 · japan_domestic 24 · us_origin 17 · international 13 · mixed_or_network 3 · public_institution 3 · corporate 2</text><rect x="20" y="329" width="710" height="43" rx="8" class="note-bg"/><text x="32" y="347" class="note">名单偏向具名、网络化、网页可见 actor；118 是工作 registry，不是总体普查。</text><text x="32" y="365" class="note"></text></g><g transform="translate(820,580)"><rect width="750" height="390" rx="14" class="panel"/><text x="24" y="36" class="ph">D4 议题</text><text x="24" y="60" class="sub">每组去重 actor；组间可重叠（n=118）</text><text x="24" y="89" class="lab">base_politics</text><rect x="209" y="75" width="430.0" height="18" rx="4" class="bar"/><text x="649.0" y="89" class="val">38</text><text x="24" y="116" class="lab">environment</text><rect x="209" y="102" width="328.2" height="18" rx="4" class="bar"/><text x="547.2" y="116" class="val">29</text><text x="24" y="143" class="lab">transnational</text><rect x="209" y="129" width="248.9" height="18" rx="4" class="bar"/><text x="467.9" y="143" class="val">22</text><text x="24" y="170" class="lab">peace_human_rights</text><rect x="209" y="156" width="192.4" height="18" rx="4" class="bar"/><text x="411.4" y="170" class="val">17</text><text x="24" y="197" class="lab">place_issue</text><rect x="209" y="183" width="169.7" height="18" rx="4" class="bar"/><text x="388.7" y="197" class="val">15</text><text x="24" y="224" class="lab">legal_policy</text><rect x="209" y="210" width="158.4" height="18" rx="4" class="bar"/><text x="377.4" y="224" class="val">14</text><text x="24" y="251" class="lab">security_politics</text><rect x="209" y="237" width="147.1" height="18" rx="4" class="bar"/><text x="366.1" y="251" class="val">13</text><text x="24" y="278" class="lab">life_safety</text><rect x="209" y="264" width="135.8" height="18" rx="4" class="bar"/><text x="354.8" y="278" class="val">12</text><text x="24" y="305" class="lab">other groups*</text><rect x="209" y="291" width="339.5" height="18" rx="4" class="bar"/><text x="558.5" y="305" class="val">30</text><rect x="20" y="329" width="710" height="43" rx="8" class="note-bg"/><text x="32" y="347" class="note">base/environment/transnational 更可见；标签数量不是议题投入、声量或支持度。</text><text x="32" y="365" class="note"></text></g><g transform="translate(30,990)"><rect width="750" height="390" rx="14" class="panel"/><text x="24" y="36" class="ph">D5 source type × archive</text><text x="24" y="60" class="sub">前 7 类 + 机械合并其余类型（n=198）</text><text x="365" y="84" text-anchor="middle" class="mini">archived</text><text x="447" y="84" text-anchor="middle" class="mini">manual</text><text x="529" y="84" text-anchor="middle" class="mini">failed</text><text x="611" y="84" text-anchor="middle" class="mini">non-URL</text><text x="24" y="117" class="lab">organization_site</text><rect x="330" y="99" width="70" height="22" rx="4" fill="#26735f" opacity="0.43"/><text x="365" y="115" text-anchor="middle" class="cell">31</text><rect x="412" y="99" width="70" height="22" rx="4" fill="#26735f" opacity="0.08"/><text x="447" y="115" text-anchor="middle" class="cell">0</text><rect x="494" y="99" width="70" height="22" rx="4" fill="#26735f" opacity="0.14"/><text x="529" y="115" text-anchor="middle" class="cell">5</text><rect x="576" y="99" width="70" height="22" rx="4" fill="#26735f" opacity="0.08"/><text x="611" y="115" text-anchor="middle" class="cell">0</text><text x="24" y="144" class="lab">local_news</text><rect x="330" y="126" width="70" height="22" rx="4" fill="#26735f" opacity="0.34"/><text x="365" y="142" text-anchor="middle" class="cell">23</text><rect x="412" y="126" width="70" height="22" rx="4" fill="#26735f" opacity="0.08"/><text x="447" y="142" text-anchor="middle" class="cell">0</text><rect x="494" y="126" width="70" height="22" rx="4" fill="#26735f" opacity="0.09"/><text x="529" y="142" text-anchor="middle" class="cell">1</text><rect x="576" y="126" width="70" height="22" rx="4" fill="#26735f" opacity="0.08"/><text x="611" y="142" text-anchor="middle" class="cell">0</text><text x="24" y="171" class="lab">local_official</text><rect x="330" y="153" width="70" height="22" rx="4" fill="#26735f" opacity="0.25"/><text x="365" y="169" text-anchor="middle" class="cell">15</text><rect x="412" y="153" width="70" height="22" rx="4" fill="#26735f" opacity="0.08"/><text x="447" y="169" text-anchor="middle" class="cell">0</text><rect x="494" y="153" width="70" height="22" rx="4" fill="#26735f" opacity="0.08"/><text x="529" y="169" text-anchor="middle" class="cell">0</text><rect x="576" y="153" width="70" height="22" rx="4" fill="#26735f" opacity="0.08"/><text x="611" y="169" text-anchor="middle" class="cell">0</text><text x="24" y="198" class="lab">court_record</text><rect x="330" y="180" width="70" height="22" rx="4" fill="#26735f" opacity="0.21"/><text x="365" y="196" text-anchor="middle" class="cell">11</text><rect x="412" y="180" width="70" height="22" rx="4" fill="#26735f" opacity="0.08"/><text x="447" y="196" text-anchor="middle" class="cell">0</text><rect x="494" y="180" width="70" height="22" rx="4" fill="#26735f" opacity="0.09"/><text x="529" y="196" text-anchor="middle" class="cell">1</text><rect x="576" y="180" width="70" height="22" rx="4" fill="#26735f" opacity="0.08"/><text x="611" y="196" text-anchor="middle" class="cell">0</text><text x="24" y="225" class="lab">official_legislative_record</text><rect x="330" y="207" width="70" height="22" rx="4" fill="#26735f" opacity="0.17"/><text x="365" y="223" text-anchor="middle" class="cell">8</text><rect x="412" y="207" width="70" height="22" rx="4" fill="#26735f" opacity="0.08"/><text x="447" y="223" text-anchor="middle" class="cell">0</text><rect x="494" y="207" width="70" height="22" rx="4" fill="#26735f" opacity="0.10"/><text x="529" y="223" text-anchor="middle" class="cell">2</text><rect x="576" y="207" width="70" height="22" rx="4" fill="#26735f" opacity="0.08"/><text x="611" y="223" text-anchor="middle" class="cell">0</text><text x="24" y="252" class="lab">prefectural_official</text><rect x="330" y="234" width="70" height="22" rx="4" fill="#26735f" opacity="0.18"/><text x="365" y="250" text-anchor="middle" class="cell">9</text><rect x="412" y="234" width="70" height="22" rx="4" fill="#26735f" opacity="0.08"/><text x="447" y="250" text-anchor="middle" class="cell">0</text><rect x="494" y="234" width="70" height="22" rx="4" fill="#26735f" opacity="0.08"/><text x="529" y="250" text-anchor="middle" class="cell">0</text><rect x="576" y="234" width="70" height="22" rx="4" fill="#26735f" opacity="0.08"/><text x="611" y="250" text-anchor="middle" class="cell">0</text><text x="24" y="279" class="lab">ngo_statement</text><rect x="330" y="261" width="70" height="22" rx="4" fill="#26735f" opacity="0.16"/><text x="365" y="277" text-anchor="middle" class="cell">7</text><rect x="412" y="261" width="70" height="22" rx="4" fill="#26735f" opacity="0.08"/><text x="447" y="277" text-anchor="middle" class="cell">0</text><rect x="494" y="261" width="70" height="22" rx="4" fill="#26735f" opacity="0.08"/><text x="529" y="277" text-anchor="middle" class="cell">0</text><rect x="576" y="261" width="70" height="22" rx="4" fill="#26735f" opacity="0.08"/><text x="611" y="277" text-anchor="middle" class="cell">0</text><text x="24" y="306" class="lab">other types</text><rect x="330" y="288" width="70" height="22" rx="4" fill="#26735f" opacity="0.90"/><text x="365" y="304" text-anchor="middle" class="cell">72</text><rect x="412" y="288" width="70" height="22" rx="4" fill="#26735f" opacity="0.10"/><text x="447" y="304" text-anchor="middle" class="cell">2</text><rect x="494" y="288" width="70" height="22" rx="4" fill="#26735f" opacity="0.18"/><text x="529" y="304" text-anchor="middle" class="cell">9</text><rect x="576" y="288" width="70" height="22" rx="4" fill="#26735f" opacity="0.10"/><text x="611" y="304" text-anchor="middle" class="cell">2</text><rect x="20" y="329" width="710" height="43" rx="8" class="note-bg"/><text x="32" y="347" class="note">failed=18 只表示抓取失败，不表示证据不存在；archived 也不保证结论充分。</text><text x="32" y="365" class="note"></text></g><g transform="translate(820,990)"><rect width="750" height="390" rx="14" class="panel"/><text x="24" y="36" class="ph">D6 review × evidence</text><text x="24" y="60" class="sub">actors n=118；actor-issue n=218</text><text x="24" y="88" class="mini">review status — human / AI-seeded / follow-up</text><text x="24" y="123" class="lab">actors</text><rect x="155.0" y="105" width="105.9" height="24" fill="#26735f"/><text x="208.0" y="122" text-anchor="middle" class="inside">25</text><rect x="260.9" y="105" width="317.8" height="24" fill="#d59a3a"/><text x="419.8" y="122" text-anchor="middle" class="inside">75</text><rect x="578.7" y="105" width="76.3" height="24" fill="#b9b5aa"/><text x="616.9" y="122" text-anchor="middle" class="inside">18</text><text x="24" y="178" class="lab">actor-issue</text><rect x="155.0" y="160" width="126.1" height="24" fill="#26735f"/><text x="218.1" y="177" text-anchor="middle" class="inside">55</text><rect x="281.1" y="160" width="295.9" height="24" fill="#d59a3a"/><text x="429.1" y="177" text-anchor="middle" class="inside">129</text><rect x="577.0" y="160" width="78.0" height="24" fill="#b9b5aa"/><text x="616.0" y="177" text-anchor="middle" class="inside">34</text><text x="24" y="228" class="mini">evidence level — E4 / E3 / E2</text><text x="24" y="262" class="lab">actors</text><rect x="155.0" y="245" width="372.9" height="22" fill="#26735f"/><text x="341.4" y="261" text-anchor="middle" class="inside">88</text><rect x="527.9" y="245" width="110.2" height="22" fill="#70a99a"/><text x="583.0" y="261" text-anchor="middle" class="inside">26</text><rect x="638.1" y="245" width="16.9" height="22" fill="#c8d9d4"/><text x="24" y="304" class="lab">actor-issue</text><rect x="155.0" y="287" width="332.6" height="22" fill="#26735f"/><text x="321.3" y="303" text-anchor="middle" class="inside">145</text><rect x="487.6" y="287" width="156.0" height="22" fill="#70a99a"/><text x="565.6" y="303" text-anchor="middle" class="inside">68</text><rect x="643.5" y="287" width="11.5" height="22" fill="#c8d9d4"/><rect x="20" y="329" width="710" height="43" rx="8" class="note-bg"/><text x="32" y="347" class="note">E4 与 human-reviewed 是不同轴；高来源等级不能替代身份、关系和解释复核。</text><text x="32" y="365" class="note"></text></g>
<text x="45" y="1402" class="mini">* D4 “other groups” 是剩余 issue-group 的 actor-group presence 合计；同一 actor 可跨组，因此不构成互斥分布。</text>
</svg>