<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<rect width="1440" height="900" fill="#fbfaf5"/>
<text x="60" y="62" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#0b3d42" text-anchor="start">USO 全国—冲绳：公开记录在哪一层中断</text>
<text x="60" y="96" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#617579" text-anchor="start">金额框采用不同会计口径，不能相加；框宽不代表金额大小</text>
<text x="60" y="146" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#0d6b6e" text-anchor="start">联邦拨款与组织财务</text>
<rect x="60" y="170" width="290" height="132" rx="16" fill="#e8f2f0" stroke="#0d6b6e" stroke-width="2"/>
<text x="80" y="204" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#0d5357" text-anchor="start">DoD / WHS → USO, Inc.</text>
<text x="80" y="234" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">USD 72.000m</text>
<text x="80" y="258" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">全国 prime award obligation</text>
<text x="80" y="282" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">2023-09-30—2028-09-29</text>
<path d="M350 236 H405" stroke="#0d6b6e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="410" y="170" width="310" height="132" rx="16" fill="#fff4dc" stroke="#ca8c25" stroke-width="2"/>
<text x="430" y="204" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#7a5312" text-anchor="start">联邦账户报送层</text>
<text x="430" y="234" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">USD 41.212m</text>
<text x="430" y="258" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">24m − 6.788m + 24m</text>
<text x="430" y="282" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">与 72m 尚未闭合</text>
<path d="M720 236 H785" stroke="#ca8c25" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowAmber)"/>
<rect x="790" y="170" width="270" height="132" rx="16" fill="#f4f5f2" stroke="#9ca8a4" stroke-width="2" stroke-dasharray="9 7"/>
<text x="810" y="204" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#536360" text-anchor="start">USO Indo-Pacific</text>
<text x="810" y="234" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">组织层级可见</text>
<text x="810" y="258" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">地区金额未公开</text>
<text x="810" y="282" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">public allocation gap</text>
<path d="M1060 236 H1115" stroke="#9ca8a4" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowGray)"/>
<rect x="1120" y="170" width="260" height="132" rx="16" fill="#f4f5f2" stroke="#9ca8a4" stroke-width="2" stroke-dasharray="9 7"/>
<text x="1140" y="204" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#536360" text-anchor="start">Japan / Okinawa</text>
<text x="1140" y="234" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">站点与人员可见</text>
<text x="1140" y="258" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">年度预算未公开</text>
<text x="1140" y="282" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">本地同口径 uses 缺失</text>
<text x="60" y="354" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#35556d" text-anchor="start">同一组织的全国财务背景（单列）</text>
<rect x="60" y="378" width="430" height="126" rx="16" fill="#eef3f8" stroke="#718ea7" stroke-width="2"/>
<text x="80" y="412" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#35556d" text-anchor="start">USO 2024 consolidated</text>
<text x="80" y="442" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">Program services: USD 204.912m</text>
<text x="80" y="466" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">组织合并费用，不是该 award 分配</text>
<text x="80" y="490" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">不能换算为冲绳预算</text>
<text x="540" y="354" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#0d6b6e" text-anchor="start">冲绳层可见的独立事实</text>
<rect x="540" y="378" width="390" height="174" rx="16" fill="#e8f2f0" stroke="#0d6b6e" stroke-width="2"/>
<text x="560" y="412" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#0d5357" text-anchor="start">具名本地资源流（个案）</text>
<text x="560" y="442" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">AEC: USD 18k (2024)</text>
<text x="560" y="466" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">AK Kogyo: JPY 1m (2025)</text>
<text x="560" y="490" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">AEC: USD 16k (2025)</text>
<text x="560" y="514" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">OESC: USD 3.25k (2025)</text>
<text x="560" y="538" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">非穷尽、跨币种，不合计</text>
<rect x="950" y="378" width="430" height="174" rx="16" fill="#e8f2f0" stroke="#0d6b6e" stroke-width="2"/>
<text x="970" y="412" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#0d5357" text-anchor="start">USO Okinawa 运作规模</text>
<text x="970" y="442" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">6 centers / 8 typed presences</text>
<text x="970" y="466" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">21 employees / 780+ volunteers</text>
<text x="970" y="490" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">约 47k supported population</text>
<text x="970" y="514" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">这些不是金额或年度 uses</text>
<text x="970" y="538" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">站点、办公室、terminal 分开统计</text>
<text x="60" y="614" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#0d6b6e" text-anchor="start">服务生态边界</text>
<rect x="60" y="638" width="415" height="152" rx="16" fill="#eef3f8" stroke="#718ea7" stroke-width="2"/>
<text x="80" y="672" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#35556d" text-anchor="start">USO</text>
<text x="80" y="702" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">中心、连接、士气与外展</text>
<text x="80" y="726" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">部分转衔与家庭项目</text>
<text x="80" y="750" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">本地服务量未形成年度同口径表</text>
<rect x="512" y="638" width="415" height="152" rx="16" fill="#eef3f8" stroke="#718ea7" stroke-width="2"/>
<text x="532" y="672" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#35556d" text-anchor="start">American Red Cross</text>
<text x="532" y="702" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">紧急通信、医院志愿、灾害支援</text>
<text x="532" y="726" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">在 NMCRS 非营业时段担任接口</text>
<text x="532" y="750" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">功能重叠不等于组织联盟</text>
<rect x="964" y="638" width="416" height="152" rx="16" fill="#eef3f8" stroke="#718ea7" stroke-width="2"/>
<text x="984" y="672" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#35556d" text-anchor="start">NMCRS</text>
<text x="984" y="702" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">无息贷款/补助、应急旅行</text>
<text x="984" y="726" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">预算教育与灾害救助</text>
<text x="984" y="750" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">Red Cross 接口使用 NMCRS funds</text>
<text x="60" y="846" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#0b3d42" text-anchor="start">最强可支持结论：全国资金与冲绳服务存在都可见，但连接二者的地区分配层没有公开闭合。</text>
<text x="1380" y="876" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#718184" text-anchor="end">W2-B · research_only · 2026-08-22</text>
