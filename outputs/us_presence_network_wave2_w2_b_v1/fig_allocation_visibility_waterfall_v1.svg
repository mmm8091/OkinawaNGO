<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040">
<rect width="1440" height="1040" fill="#fbfaf5"/>
<text x="60" y="58" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#0b3d42" text-anchor="start">USO 全国-冲绳：公开分配信息在哪里中断</text>
<text x="60" y="92" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#617579" text-anchor="start">金额框是不同报送或财务口径；框宽不编码金额</text>
<text x="60" y="136" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#0d6b6e" text-anchor="start">同一 award 的两个并列报送视图</text>
<rect x="60" y="160" width="580" height="148" rx="16" fill="#e8f2f0" stroke="#0d6b6e" stroke-width="2"/>
<text x="80" y="194" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#0d5357" text-anchor="start">视图 A · award-level record</text>
<text x="80" y="224" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">USD 72.000m cumulative obligation</text>
<text x="80" y="248" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">prime recipient: USO, Inc.</text>
<text x="80" y="272" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">2023-09-30 to 2028-09-29</text>
<text x="80" y="296" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">不是现金支付或地区份额</text>
<rect x="800" y="160" width="580" height="148" rx="16" fill="#fff4dc" stroke="#ca8c25" stroke-width="2"/>
<text x="820" y="194" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#7a5312" text-anchor="start">视图 B · federal-account reporting</text>
<text x="820" y="224" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">USD 41.21246329m</text>
<text x="820" y="248" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">24m - 6.78753671m + 24m</text>
<text x="820" y="272" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">同一 award 的账户报送口径</text>
<text x="820" y="296" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">不是第二笔 award 或下一层现金流</text>
<path d="M350 308 V338 H610 V374" stroke="#718184" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#arrowGray)"/>
<path d="M1090 308 V338 H830 V374" stroke="#718184" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#arrowGray)"/>
<text x="720" y="362" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#617579" text-anchor="middle">连线表示共同的信息缺口，不表示资金逐层流下</text>
<rect x="450" y="380" width="540" height="150" rx="16" fill="#f4f5f2" stroke="#9ca8a4" stroke-width="2" stroke-dasharray="9 7"/>
<text x="470" y="414" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#536360" text-anchor="start">Regional allocation gap</text>
<text x="470" y="444" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">USO, Inc. -&gt; Indo-Pacific: not disclosed</text>
<text x="470" y="468" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">Indo-Pacific -&gt; Japan/Okinawa: not disclosed</text>
<text x="470" y="492" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">USO Okinawa annual budget: not disclosed</text>
<text x="470" y="516" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">两种报送视图都没有地区分配字段</text>
<text x="60" y="574" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#35556d" text-anchor="start">全国组织财务背景（与 award 分配分开）</text>
<rect x="60" y="598" width="610" height="154" rx="16" fill="#eef3f8" stroke="#718ea7" stroke-width="2"/>
<text x="80" y="632" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#35556d" text-anchor="start">USO 2024 program services</text>
<text x="80" y="662" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">Gross functional expenses: USD 204.912m</text>
<text x="80" y="686" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">In-kind included in gross: USD 105.538m</text>
<text x="80" y="710" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">Net program services: USD 99.374m</text>
<text x="80" y="734" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">全国合并口径，不是冲绳预算</text>
<text x="730" y="574" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#0d6b6e" text-anchor="start">冲绳层可见的独立事实</text>
<rect x="730" y="598" width="650" height="154" rx="16" fill="#e8f2f0" stroke="#0d6b6e" stroke-width="2"/>
<text x="750" y="632" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#0d5357" text-anchor="start">具名本地资源流与运作规模</text>
<text x="750" y="662" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">AEC USD 18k (2024); AK Kogyo JPY 1m (2025)</text>
<text x="750" y="686" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">AEC USD 16k; OESC USD 3.25k (2025)</text>
<text x="750" y="710" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">6 centers + terminal entry + area office</text>
<text x="750" y="734" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">21 employees / 780+ volunteers</text>
<text x="60" y="796" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#0d6b6e" text-anchor="start">服务生态边界</text>
<rect x="60" y="820" width="415" height="150" rx="16" fill="#eef3f8" stroke="#718ea7" stroke-width="2"/>
<text x="80" y="854" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#35556d" text-anchor="start">USO</text>
<text x="80" y="884" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">中心、连接、士气与外展</text>
<text x="80" y="908" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">部分转衔与家庭项目</text>
<text x="80" y="932" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">本地年度同口径服务量缺失</text>
<rect x="512" y="820" width="415" height="150" rx="16" fill="#eef3f8" stroke="#718ea7" stroke-width="2"/>
<text x="532" y="854" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#35556d" text-anchor="start">American Red Cross</text>
<text x="532" y="884" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">紧急通信、医院志愿、灾害支援</text>
<text x="532" y="908" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">接受 NMCRS 非营业时段委托</text>
<text x="532" y="932" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">代表 NMCRS 处理 intake/disbursement</text>
<rect x="964" y="820" width="416" height="150" rx="16" fill="#eef3f8" stroke="#718ea7" stroke-width="2"/>
<text x="984" y="854" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#35556d" text-anchor="start">NMCRS</text>
<text x="984" y="884" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">无息贷款/补助、应急旅行</text>
<text x="984" y="908" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">NMCRS -&gt; ARC 委托候选</text>
<text x="984" y="932" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#415a5e" text-anchor="start">ARC 使用 NMCRS funds</text>
<text x="60" y="1008" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#0b3d42" text-anchor="start">最强可支持结论：全国报送与冲绳服务存在可见，但连接二者的地区分配层没有公开闭合。</text>
<text x="1380" y="1024" font-family="Inter, Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#718184" text-anchor="end">W2-B · research_only · 2026-08-22</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0d6b6e"/></marker><marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ca8c25"/></marker><marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9ca8a4"/></marker></defs>
</svg>
