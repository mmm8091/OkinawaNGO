<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R8 procedure outputs</title><style>body{margin:0;background:#e8e5dd}main{max-width:1700px;margin:20px auto;box-shadow:0 8px 28px #0002}svg{display:block;width:100%;height:auto}@media(max-width:700px){main{margin:0;box-shadow:none}}</style></head><body><main><svg xmlns="http://www.w3.org/2000/svg" width="1690" height="1285" viewBox="0 0 1690 1285" role="img" aria-labelledby="flow-title flow-desc">
<title id="flow-title">R8 六案如何进入不同程序并产生不同程序产出</title>
<desc id="flow-desc">Six horizontal case lanes compare controversy and place, procedural entry, accepted roles, institutional target, and observed procedural output. The ordering is explanatory, not causal.</desc>
<rect width="1690" height="1285" fill="#f3f0e8"/>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#17312b}.title{font-size:31px;font-weight:700}.sub{font-size:14px;fill:#5d6a65}.col{font-size:16px;font-weight:700}.rule{stroke:#8d9b96;stroke-width:1}.lane{fill:#fffdf8;stroke:#d4d0c5}.case{font-size:15px;font-weight:700}.body{font-size:13px}.small{font-size:12px}.limit{font-size:11px;fill:#6b5a3c}.out-a{fill:#d8e8df}.out-b{fill:#eadccb}</style>
<text x="35" y="48" class="title">R8：争议如何进入程序，程序产出是什么</text>
<text x="35" y="77" class="sub">六案均为 HR-014 human_checked；横向顺序表示制度转译的比较框架，不是因果链，也不是胜败排行榜。</text>
<rect x="35" y="91" width="1625" height="27" rx="7" fill="#efe2c6"/><text x="48" y="110" class="limit">角色必须按案件读取：plaintiff / counsel / requester / commenter / supporter / non_party / institutional node 不可互换。</text>
<text x="45" y="128" class="col">争议／地点</text><line x1="35" y1="140" x2="285" y2="140" class="rule"/><text x="310" y="128" class="col">程序入口</text><line x1="300" y1="140" x2="600" y2="140" class="rule"/><text x="625" y="128" class="col">已审角色</text><line x1="615" y1="140" x2="915" y2="140" class="rule"/><text x="940" y="128" class="col">制度对象</text><line x1="930" y1="140" x2="1180" y2="140" class="rule"/><text x="1205" y="128" class="col">可观察程序产出／边界</text><line x1="1195" y1="140" x2="1650" y2="140" class="rule"/><rect x="25" y="147" width="1640" height="162" rx="12" class="lane"/><text x="45" y="175" class="case"><tspan x="45" dy="0">边野古／大浦湾儒艮</tspan><tspan x="45" dy="25">Henoko; Oura Bay</tspan></text><text x="310" y="173" class="body"><tspan x="310" dy="0">美国 NHPA §402／</tspan><tspan x="310" dy="21">APA 联邦司法审查</tspan></text><text x="625" y="170" class="body"><tspan x="625" dy="0">plaintiff × 4</tspan><tspan x="625" dy="20">counsel × 1</tspan><tspan x="625" dy="20">non_party × 2</tspan></text><text x="940" y="173" class="body"><tspan x="940" dy="0">U.S. Department of Defense</tspan></text><text x="1210" y="169" class="body"><tspan x="1210" dy="0">形成 Section 402 可审查程序标准与公开记录</tspan><tspan x="1210" dy="22">2020 年维持 DoD 胜诉；没有停止工程</tspan></text><text x="310" y="270" class="limit"><tspan x="310" dy="0">制度转译：基地建设与儒艮影响 → 海外文化财程序义务</tspan></text><text x="1210" y="270" class="limit"><tspan x="1210" dy="0">程序标准／信息生产与最终救济结果必须并列；不是阻止工程的政策效果。</tspan></text><rect x="25" y="327" width="1640" height="162" rx="12" class="lane"/><text x="45" y="355" class="case"><tspan x="45" dy="0">边野古／大浦湾 EIA</tspan><tspan x="45" dy="25">Henoko; Oura Bay</tspan></text><text x="310" y="353" class="body"><tspan x="310" dy="0">日本 EIA 方法书／</tspan><tspan x="310" dy="21">补正评价书正式意见</tspan></text><text x="625" y="350" class="body"><tspan x="625" dy="0">commenter × 1</tspan><tspan x="625" dy="20">proponent × 1</tspan><tspan x="625" dy="20">institutional_recipient × 1</tspan></text><text x="940" y="353" class="body"><tspan x="940" dy="0">Okinawa Defense Bureau</tspan><tspan x="940" dy="20"> Minister of Defense</tspan><tspan x="940" dy="20"> Minister of Environment</tspan><tspan x="940" dy="20"> Governor of Okinawa</tspan></text><text x="1210" y="349" class="body"><tspan x="1210" dy="0">NACSJ 的科学批评进入正式行政记录</tspan><tspan x="1210" dy="22">补正 EIA 完成；不证明意见被采纳或工程停止</tspan></text><text x="310" y="450" class="limit"><tspan x="310" dy="0">制度转译：基地建设与生态影响 → 调查、预测、减缓充分性</tspan></text><text x="1210" y="450" class="limit"><tspan x="1210" dy="0">commenter、事业者和审查／收件机关不可合并；提交意见不等于采纳。</tspan></text><rect x="25" y="507" width="1640" height="162" rx="12" class="lane"/><text x="45" y="535" class="case"><tspan x="45" dy="0">第三次嘉手纳噪音</tspan><tspan x="45" dy="25">Kadena; Chatan; Okinawa City</tspan></text><text x="310" y="533" class="body"><tspan x="310" dy="0">日本民事差止与过去／</tspan><tspan x="310" dy="21">未来损害赔偿诉讼</tspan></text><text x="625" y="530" class="body"><tspan x="625" dy="0">plaintiff × 2</tspan><tspan x="625" dy="20">counsel × 1</tspan><tspan x="625" dy="20">defendant × 1</tspan></text><text x="940" y="533" class="body"><tspan x="940" dy="0">Government of Japan</tspan></text><text x="1210" y="529" class="body"><tspan x="1210" dy="0">符合条件的过去噪音损害赔偿获维持</tspan><tspan x="1210" dy="22">运营／噪音差止及未来损害请求被驳回</tspan></text><text x="310" y="630" class="limit"><tspan x="310" dy="0">制度转译：航空器噪音与日常负担 → 人格／生活损害</tspan></text><text x="1210" y="630" class="limit"><tspan x="1210" dy="0">赔偿不表示噪音停止；A052 不代表所有个体或其他轮次成员恒定。</tspan></text><rect x="25" y="687" width="1640" height="162" rx="12" class="lane"/><text x="45" y="715" class="case"><tspan x="45" dy="0">普天间周边噪音</tspan><tspan x="45" dy="25">Futenma; Ginowan</tspan></text><text x="310" y="713" class="body"><tspan x="310" dy="0">2018／</tspan><tspan x="310" dy="21">2020 并合损害赔偿诉讼</tspan></text><text x="625" y="710" class="body"><tspan x="625" dy="0">plaintiff × 2</tspan><tspan x="625" dy="20">counsel × 1</tspan><tspan x="625" dy="20">defendant × 1</tspan></text><text x="940" y="713" class="body"><tspan x="940" dy="0">Government of Japan</tspan></text><text x="1210" y="709" class="body"><tspan x="1210" dy="0">法院命令日本向列名原告赔偿指定期间损害</tspan><tspan x="1210" dy="22">其余请求被驳回；没有形成运营禁令</tspan></text><text x="310" y="810" class="limit"><tspan x="310" dy="0">制度转译：航空器噪音与睡眠／健康负担 → 期间损害</tspan></text><text x="1210" y="810" class="limit"><tspan x="1210" dy="0">A053 是案件特定 plaintiff group；并合案与其他轮次不等于人员完全相同。</tspan></text><rect x="25" y="867" width="1640" height="162" rx="12" class="lane"/><text x="45" y="895" class="case"><tspan x="45" dy="0">石垣部署住民投票</tspan><tspan x="45" dy="25">Ishigaki; Hirae-Omata</tspan></text><text x="310" y="893" class="body"><tspan x="310" dy="0">条例请求后进入不作为违法确认／</tspan><tspan x="310" dy="21">义务付诉讼</tspan></text><text x="625" y="890" class="body"><tspan x="625" dy="0">plaintiff × 1</tspan><tspan x="625" dy="20">counsel × 1</tspan><tspan x="625" dy="20">requester × 1</tspan><tspan x="625" dy="20">defendant × 1</tspan></text><text x="940" y="893" class="body"><tspan x="940" dy="0">Mayor of Ishigaki</tspan><tspan x="940" dy="20"> Ishigaki City</tspan></text><text x="1210" y="889" class="body"><tspan x="1210" dy="0">法院明确了义务付诉讼的行政处分门槛</tspan><tspan x="1210" dy="22">因住民投票实施不属可义务付处分而全部驳回</tspan></text><text x="310" y="990" class="limit"><tspan x="310" dy="0">制度转译：陆自部署争议 → 地方自治与住民投票实施义务</tspan></text><text x="1210" y="990" class="limit"><tspan x="1210" dy="0">A011 是 requester／campaign body，不是具名组织原告；议会与市长步骤分开。</tspan></text><rect x="25" y="1047" width="1640" height="162" rx="12" class="lane"/><text x="45" y="1075" class="case"><tspan x="45" dy="0">泡濑公金支出</tspan><tspan x="45" dy="25">Awase tidal flat; Okinawa City</tspan></text><text x="310" y="1073" class="body"><tspan x="310" dy="0">住民监查与地方自治法公金支出差止诉讼</tspan></text><text x="625" y="1070" class="body"><tspan x="625" dy="0">plaintiff × 1</tspan><tspan x="625" dy="20">counsel × 1</tspan><tspan x="625" dy="20">supporter × 2</tspan><tspan x="625" dy="20">defendant × 1</tspan></text><text x="940" y="1073" class="body"><tspan x="940" dy="0">Governor of Okinawa</tspan><tspan x="940" dy="20"> Mayor of Okinawa City</tspan></text><rect x="1205" y="1062" width="435" height="48" rx="8" class="out-a"/><text x="1220" y="1081" class="small"><tspan x="1220" dy="0">第一波：无合理修订计划时限制未来支出</tspan></text><rect x="1205" y="1120" width="435" height="48" rx="8" class="out-b"/><text x="1220" y="1139" class="small"><tspan x="1220" dy="0">第二波：居民上诉败诉，2017 年上告／申请被驳回</tspan></text><text x="310" y="1170" class="limit"><tspan x="310" dy="0">制度转译：填海生态／经济／灾害风险 → 公共支出合法性与合理性</tspan></text><text x="1210" y="1170" class="limit"><tspan x="1210" dy="0">两波相反结果必须分列；A055、A020 均为 supporter，不是本案组织原告／counsel。</tspan></text></svg></main></body></html>
