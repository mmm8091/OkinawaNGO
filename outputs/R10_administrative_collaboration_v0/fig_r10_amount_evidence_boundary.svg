<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc"><title id="title">F032：金额证据边界（当前 28 条）</title><desc id="desc">Twenty-eight reviewed amount observations split into ten named money observations and eighteen contextual or bounded amounts. Only five are actual contract amounts.</desc><rect width="100%" height="100%" fill="#FAF9F5"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#17231F}.title{font-size:32px;font-weight:700}.sub{font-size:15px;fill:#52605A}.head{font-size:18px;font-weight:700}.label{font-size:15px}.small{font-size:13px;fill:#52605A}.tiny{font-size:12px;fill:#65716C}.num{font-size:30px;font-weight:700}.count{font-size:19px;font-weight:700}</style><text x="58" y="55" class="title">F032：金额证据边界（当前 28 条）</text><text x="58" y="84" class="sub">把合同、点名资金流、捐赠与 project cost／aggregate／实物价值分开</text><text x="58" y="130" class="num">28</text><text x="115" y="127" class="head">条金额观察：21 checked＋6 revised＋1 local</text><text x="115" y="152" class="small">仅 5 条 amount_basis=actual_contract_amount；币种与口径不跨项求和</text><line x1="800" y1="188" x2="800" y2="698" stroke="#B6C0BB" stroke-width="2" stroke-dasharray="8 7"/><text x="58" y="207" class="head">可作具名金额表达</text><text x="842" y="207" class="head">只能作背景／边界金额</text><rect x="58" y="240" width="700" height="94" rx="13" fill="#17624F" opacity="0.16" stroke="#17624F"/><rect x="58" y="240" width="10" height="94" rx="5" fill="#17624F"/><text x="86" y="277" class="head">实际合同额</text><text x="730" y="283" text-anchor="end" class="num">5</text><text x="86" y="310" class="small">可写作具名合同；不得拆给 JV 成员</text><rect x="58" y="385" width="700" height="94" rx="13" fill="#3D7C6C" opacity="0.16" stroke="#3D7C6C"/><rect x="58" y="385" width="10" height="94" rx="5" fill="#3D7C6C"/><text x="86" y="422" class="head">点名委托资金流</text><text x="730" y="428" text-anchor="end" class="num">3</text><text x="86" y="455" class="small">点名委托流；其中 1 条仅为部分范围</text><rect x="58" y="530" width="700" height="94" rx="13" fill="#6F9F92" opacity="0.16" stroke="#6F9F92"/><rect x="58" y="530" width="10" height="94" rx="5" fill="#6F9F92"/><text x="86" y="567" class="head">点名现金捐赠</text><text x="730" y="573" text-anchor="end" class="num">2</text><text x="86" y="600" class="small">可写作具名慈善捐赠；不是政治支持</text><rect x="842" y="240" width="700" height="94" rx="13" fill="#C97926" opacity="0.16" stroke="#C97926"/><rect x="842" y="240" width="10" height="94" rx="5" fill="#C97926"/><text x="870" y="277" class="head">项目／事业成本</text><text x="1514" y="283" text-anchor="end" class="num">14</text><text x="870" y="310" class="small">不是 actor payment，也不是 contract／award</text><rect x="842" y="352" width="700" height="94" rx="13" fill="#9D8E78" opacity="0.16" stroke="#9D8E78"/><rect x="842" y="352" width="10" height="94" rx="5" fill="#9D8E78"/><text x="870" y="389" class="head">recipient 未解析</text><text x="1514" y="395" text-anchor="end" class="num">1</text><text x="870" y="422" class="small">2.196m 的 recipient scope 未解析</text><rect x="842" y="464" width="700" height="94" rx="13" fill="#7E8984" opacity="0.16" stroke="#7E8984"/><rect x="842" y="464" width="10" height="94" rx="5" fill="#7E8984"/><text x="870" y="501" class="head">跨期／混合汇总</text><text x="1514" y="507" text-anchor="end" class="num">2</text><text x="870" y="534" class="small">不能拆到单一 recipient／年度</text><rect x="842" y="576" width="700" height="94" rx="13" fill="#8B6F93" opacity="0.16" stroke="#8B6F93"/><rect x="842" y="576" width="10" height="94" rx="5" fill="#8B6F93"/><text x="870" y="613" class="head">实物价值（非现金）</text><text x="1514" y="619" text-anchor="end" class="num">1</text><text x="870" y="646" class="small">物品估值，不是现金支付</text><rect x="58" y="735" width="1482" height="185" rx="14" fill="#FFFFFF" stroke="#D0D6D2"/><text x="85" y="772" text-anchor="start" class="label"><tspan x="85" dy="0">14 条 project／program cost 均为 not_actor_payment；其中 grant 关系相关金额也不是 award 或 paid amount。</tspan><tspan x="85" dy="36">NOFO／grant opportunity 没有进入 28 条金额观察：机会公告不证明 award、recipient 或付款。</tspan><tspan x="85" dy="36">sponsor tier、service presence、membership 与 co-presence 没有金额时保持空值，不补 0、不估值。</tspan><tspan x="85" dy="36">JPY 与 USD 不相加；实物价值不等于现金；事件参与不等于联盟。</tspan></text></svg>