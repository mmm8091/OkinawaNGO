Friendship \u2728","message":{"text":"\u2728 A Constellation of Friendship \u2728\n\nThe AWWA Friendship Banquet was more than just an evening together\u2014it felt like watching a constellation come to life.\n\nEach conversation, each shared laugh, and each moment of connection shined in its own way, coming together to create something truly meaningful.\n\nThis night was a reminder that community isn\u2019t built in a single moment, but in all the small, intentional ways we show up for one another. And when we do, something beautiful forms\u2014steady, bright, and lasting.\n\nWe are so deeply grateful to be part of a community like this, and to serve alongside our incredible partner organizations. It\u2019s an honor to stand together, connected by purpose and strengthened by friendship.\n\nThank you for being a part of this constellation\u2014for bringing your light, your heart, and your presence. \n\n\ud83d\udcf8 View the full photo gallery here: https:\/\/ekstudiophotography2021.pixieset.com\/awwafriendshipbanquet\/"},"save_info":{"viewer_save_state":"NOT_SAVED","savable":{"__typename":"Photo","savable_title":{"text":"American Welfare & Works Association - AWWA \u3000\u7c73\u56fd\u798f\u7949\u4e8b\u696d\u5354\u4f1a\u3055\u3093\u306e\u5199\u771f"},"id":"1377823487702426"},"save_flow":null},"actors":[{"__typename":"User","name":"American Welfare & Works Association - AWWA \u3000\u7c73\u56fd\u798f\u7949\u4e8b\u696d\u5354\u4f1a","id":"100064243647189"}],"__module_operation_useCometUFIAdaptivePostActionBar_story":{"__dr":"CometUFIAdaptiveShareActionRenderer_story$normalization.graphql"},"__module_component_useCometUFIAdaptivePostActionBar_story":{"__dr":"CometUFIAdaptiveShareActionRenderer.react"},"vote_attachments":[],"feed_backend_data":{"pcomment":0}},"__module_operation_CometFeedUFIContainer_story":{"__dr":"CometSimplifiedUFIContainer_renderer$normalization.graphql"},"__module_component_CometFeedUFIContainer_story":{"__dr":"CometSimplifiedUFIContainer.react"}},"id
